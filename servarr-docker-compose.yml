######################################################################################################################################################################
# INDEXERS
######################################################################################################################################################################

#prowlarr - manages indexers, routed through the VPN
###################################################################################
# Reachable from the rest of the stack at 172.39.0.2:9696 (gluetun's address), NOT
# at its old 172.39.0.11 - see the migration notes at the end of the file.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    labels:
      - deunhealth.restart.on.unhealthy=true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      #- /etc/localtime:/etc/localtime:ro
      - ./prowlarr/config:/config
      - ./prowlarr/cache:/cache
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 60s
      retries: 3
      start_period: 30s
      timeout: 10s

#flaresolverr - helps with captchas for indexers
###################################################################################
# Shares gluetun's namespace with prowlarr, so Cloudflare sees one and the same IP
# solving the challenge and then using it - which is exactly what it wants.
# Prowlarr must now be pointed at http://localhost:8191, not at 172.39.0.12:8191.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=${TZ}
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun
    # The image is python-slim and ships no ping/curl/wget, hence the python probe.
    # Uncomment to let deunhealth restart it too (and add the label above);
    # verify it passes first - a future base image may move python off PATH.
    #labels:
    #  - deunhealth.restart.on.unhealthy=true
    #healthcheck:
    #  test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/', timeout=10)\" || exit 1"]
    #  interval: 60s
    #  retries: 3
    #  start_period: 30s
    #  timeout: 15s

#########################################################################################################################################
# MEDIA MANAGEMENT
######################################################################################################################################################################

#sonarr - manages TV series
###################################################################################
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      #- /etc/localtime:/etc/localtime:ro
      - ./sonarr:/config
      - /data:/data
    ports:
      - 8989:8989
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.6

#radarr - manages movies
###################################################################################
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      #- /etc/localtime:/etc/localtime:ro
      - ./radarr:/config
      - /data:/data
    ports:
      - 7878:7878
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.7

#lidarr - manages music
###################################################################################
  lidarr:
    container_name: lidarr
    image: lscr.io/linuxserver/lidarr:latest
    restart: unless-stopped
    volumes:
      #- /etc/localtime:/etc/localtime:ro
      - ./lidarr:/config
      - /data:/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 8686:8686
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.8

#bazarr - manages subtitles
###################################################################################
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      #- /etc/localtime:/etc/localtime:ro
      - ./bazarr:/config
      - /data:/data
    ports:
      - 6767:6767
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.9

#profilarr - manages quality profiles for sonarr and radarr
###################################################################################
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:latest
    container_name: profilarr
    restart: unless-stopped
    ports:
      - 6868:6868
    volumes:
      - ./profilarr:/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=022
      - TZ=${TZ}
      - AUTH=off
      - ORIGIN=https://profilarr.local-infra.duckdns.org
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.13

#########################################################################################################################################
# MAINTENANCE / AUTOMATION
######################################################################################################################################################################

#cleanuparr - clears stalled/failed downloads, blocks bad releases
###################################################################################
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    environment:
      - PORT=11011
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=022
      - TZ=${TZ}
    volumes:
      - ./cleanuparr:/config
      - /data:/data
    ports:
      - 11011:11011
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.14
    depends_on:
      sonarr:
        condition: service_started
      radarr:
        condition: service_started
      qbittorrent:
        condition: service_started

#autoscan - immediate Jellyfin library scan on import instead of waiting for the periodic one
###################################################################################
  autoscan:
    image: ghcr.io/niniyas/autoscan:latest
    container_name: autoscan
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=022
      - TZ=${TZ}
    volumes:
      - ./autoscan:/config
    ports:
      - 3468:3468
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.15
    depends_on:
      jellyfin:
        condition: service_started
      sonarr:
        condition: service_started
      radarr:
        condition: service_started

######################################################################################################################################################################
# MEDIA SERVER
######################################################################################################################################################################

#jellyfin - media server
###################################################################################
# Remove the Jellyfin service if installed directly on system.
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    #  - JELLYFIN_PublishedServerUrl=http://10.0.0.101 #optional
    volumes:
      - ./jellyfin:/config
      - /data/jellyfin:/data:ro
    devices:
      - /dev/dri:/dev/dri #Use for Intel QuickSync
    ports:
      - 8096:8096
    #  - 7359:7359/udp #Service Discovery
    #  - 1900:1900/udp #Client Discovery
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.4
    restart: unless-stopped

######################################################################################################################################################################
# REQUESTS
######################################################################################################################################################################

#jellyseerr - movie and TV request management
###################################################################################
  jellyseerr:
    container_name: jellyseerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    environment:
      - TZ=${TZ}
    volumes:
      - ./jellyseerr:/app/config
    ports:
      - 5055:5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.3
    restart: unless-stopped
    depends_on:
      jellyfin:
        condition: service_started
      sonarr:
        condition: service_started
      radarr:
        condition: service_started
      prowlarr:
        condition: service_started

#musicseerr - music request management
###################################################################################
  musicseerr:
    image: ghcr.io/habirabbu/musicseerr:latest
    container_name: musicseerr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 8688:8688
    volumes:
      - ./musicseer/config:/app/config
      - ./musicseer/cache:/app/cache
      - /data/jellyfin:/music:ro
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.5
    restart: unless-stopped
    depends_on:
      lidarr:
        condition: service_started
      jellyfin:
        condition: service_started

#########################################################################################################################################
# FRONTEND
######################################################################################################################################################################

#halcyon - the Jellyfin library as a walkable 1990s video rental store
###################################################################################
# Not a linuxserver.io image - it runs as root and ignores PUID/PGID, so the
# Remote Play seed in ./halcyon will be root-owned. The store renders in the
# client's browser, so everything works on the bridge; server-side rendering
# (Remote Play) needs host networking - see the note at the end of the file.
  halcyon:
    image: ghcr.io/halcyon-video/halcyon-video:latest # v0.2.1 - amd64 only for now
    container_name: halcyon
    init: true
    environment:
      - TZ=${TZ}
      # vite preview only accepts localhost and bare-IP Host headers by default,
      # so every DNS name you reach the store by has to be listed here.
      - HALCYON_ALLOWED_HOSTS=media,halcyon.local-infra.duckdns.org
      # Log into Jellyfin once from any browser and switch on
      # Settings -> Connection -> Remote Play to donate that login to the server.
      - REMOTE_PLAY_SEED=/config/remote-play-seed.json
      #- REMOTE_PLAY_MAX_INSTANCES=2 # concurrent private instances (default 2)
    volumes:
      - ./halcyon:/config
    ports:
      - 1420:1420
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.16
    restart: unless-stopped
    depends_on:
      jellyfin:
        condition: service_started
      jellyseerr:
        condition: service_started

# Remote Play variant (phone, set-top box, weak smart TV browser): WebRTC has to
# advertise an address the client can actually reach, and from the bridge it can
# only offer 172.39.0.16. Replace the 'ports' and 'networks' blocks above with:
#    network_mode: host    # takes :1420, :3478/udp and 49200-49260/udp (TURN)
#    devices:
#      - /dev/dri:/dev/dri # GL + encode for the headless Chromium
#    shm_size: 1gb         # Chromium crashes on the default 64 MB /dev/shm

#########################################################################################################################################
# ONE-TIME MIGRATION after moving prowlarr + flaresolverr behind the VPN
#
# Both containers gave up their own IPs (172.39.0.11 / .12) and now answer on
# gluetun's address, so three places hold a now-dead address:
#
#  1. Prowlarr -> Settings -> Indexers -> FlareSolverr proxy:
#       http://172.39.0.12:8191  ->  http://localhost:8191
#     (same namespace now, so it is literally localhost)
#
#  2. Prowlarr -> Settings -> Apps -> each of sonarr/radarr/lidarr,
#     field "Prowlarr Server":
#       http://172.39.0.11:9696  ->  http://172.39.0.2:9696
#     The "<App> Server" field on the same form (172.39.0.6/.7/.8) stays as it is.
#     Hit "Test", then Sync App Indexers so the *arrs get the new Torznab URLs.
#
#  3. Anything else pointing at prowlarr - Jellyseerr, dashboards, bookmarks:
#       172.39.0.11:9696  ->  172.39.0.2:9696  (or host-ip:9696, unchanged)
#
# Apply with:  docker compose up -d
# Verify the tunnel actually covers them - both must print the VPN's IP, not yours:
#   docker exec prowlarr     curl -s https://ipinfo.io/ip
#   docker exec flaresolverr python -c "import urllib.request;print(urllib.request.urlopen('https://ipinfo.io/ip').read().decode())"
#########################################################################################################################################
