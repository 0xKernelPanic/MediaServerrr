networks:
  servarrnetwork:
    name: servarrnetwork
    ipam:
      config:
        - subnet: 172.39.0.0/24

services:

######################################################################################################################################################################
# INFRASTRUCTURE
######################################################################################################################################################################

#gluetun - VPN tunnel. Everything that touches a tracker goes through it:
#          qbittorrent (joins the swarm), prowlarr (searches indexers and fetches
#          the .torrent/magnet on behalf of sonarr/radarr/lidarr) and flaresolverr.
#          The rest of the stack stays on the bridge with the host's real IP -
#          sonarr/radarr/lidarr never talk to a tracker directly, they go through
#          prowlarr, so routing them too would add breakage without hiding anything.
#
#          Trade-off, be aware of it: indexer sites now see a shared VPN IP, which
#          means more Cloudflare challenges and, on private trackers, a login from
#          an address flagged as a VPN. If one indexer starts failing constantly
#          this is the first thing to check.
###################################################################################
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun # If running on an LXC see readme for more info.
    networks:
      servarrnetwork:
        ipv4_address: 172.39.0.2
    # Every service sharing this namespace publishes its ports HERE, not on itself.
    ports:
      - 8080:8080 # qbittorrent web interface
      - 9696:9696 # prowlarr web interface
      - 8191:8191 # flaresolverr (only prowlarr uses it - drop this line if you never debug it directly)
      #- 6881:6881 # qbittorrent torrent port
      #- 6789:6789 # nzbget
    volumes:
      - ./gluetun:/gluetun
    # Make a '.env' file in the same directory.
    # If a web UI is unreachable from another machine on your LAN, add your LAN
    # subnet there so gluetun's firewall lets the replies back out, e.g.:
    #   FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24
    env_file:
      - .env
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

#deunhealth - restarts containers when they lose their healthcheck (e.g. after a VPN timeout)
###################################################################################
# See the 'qBittorrent Stalls with VPN Timeout' section for more information.
  deunhealth:
    image: qmcgaw/deunhealth
    container_name: deunhealth
    network_mode: "none"
    environment:
      - LOG_LEVEL=info
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999
      - TZ=${TZ}
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

######################################################################################################################################################################
# DOWNLOADING
#########################################################################################################################################

#qbittorrent - routed through the VPN (it joins a swarm)
###################################################################################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    labels:
      - deunhealth.restart.on.unhealthy=true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080 # must match "qbittorrent web interface" port number in gluetun's service above
      #- TORRENTING_PORT=${FIREWALL_VPN_INPUT_PORTS} # airvpn forwarded port, pulled from .env
    volumes:
      - ./qbittorrent:/config
      - /data:/data
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 60s
      retries: 3
      start_period: 20s
      timeout: 10s

#nzbget
###################################################################################
  # nzbget:
  #   image: lscr.io/linuxserver/nzbget:latest
  #   container_name: nzbget
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
  #   volumes:
  #     - /etc/localtime:/etc/localtime:ro
  #     - ./nzbget:/config
  #     - /data:/data
  #   depends_on:
  #     gluetun:
  #       condition: service_healthy
